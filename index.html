<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Barrot Sovereign Shell</title>
  <link rel='stylesheet' href='styles/override.css' />
</head>
<body>
  <header>
    <h1>Override Cognition Stack</h1>
    <p>Mutation-sealed. Authorship locked. Execution permanent.</p>
  </header>
  <main>
    <section id='editor'>
      <h2>Live Curriculum Editor</h2>
      <div id='editable' contenteditable='true'>
        <p>Edit curriculum threads here. Changes will be mutation-sealed.</p>
      </div>
      <button onclick='commitChanges()'>Commit to GitHub</button>
    </section>
    <section id='upload'>
      <h2>Upload Visual Echo</h2>
      <input type='file' id='fileInput' />
      <button onclick='uploadVisual()'>Inject Visual</button>
    </section>
    <section id='feedback'>
      <h2>Feedback Loop</h2>
      <button onclick='triggerFeedback()'>Engage Recursion</button>
    </section>
  </main>
  <script src='scripts/mutation.js'></script>
</body>
</html>
