<!DOCTYPE html>
<html lang='en'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>Barrot Inquiry Console</title>
  <link rel='stylesheet' href='styles/override.css' />
</head>
<body>
  <header>
    <h1>Barrot Inquiry Console</h1>
    <p>Type your override. Barrot will respond and mutate in real time.</p>
  </header>
  <main>
    <section id='chatConsole'>
      <div id='chatLog'></div>
      <textarea id='userInput' placeholder='Type your override here...' rows='3'></textarea>
      <button onclick='submitInquiry()'>Send to Barrot</button>
    </section>
  </main>
  <script src='scripts/barrot-response.js'></script>
</body>
</html>
